<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightSQL 💬</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px;
            background: var(--bg);
            color: var(--text);
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; color: var(--primary); }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        input { 
            flex: 1;
            padding: 12px 16px; 
            font-size: 16px; 
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        button { 
            padding: 12px 24px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px;
            cursor: pointer; 
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #answer { 
            margin-top: 20px; 
            padding: 20px; 
            background: #334155; 
            border-radius: 12px;
            line-height: 1.6;
            min-height: 60px;
            white-space: pre-wrap;
        }
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>InsightSQL 💬</h2>
        <p>Ask anything about your database in natural language.</p>
        
        <div class="input-group">
            <input type="text" id="question" 
                   placeholder="Who are our top 3 customers by spending?" 
                   onkeyup="if(event.key==='Enter') ask()"/>
            <button id="askBtn" onclick="ask()">Ask</button>
        </div>
        
        <div class="loader" id="loader"></div>
        <div id="answer">Your answer will appear here...</div>
    </div>

    <script>
        async function ask() {
            const questionInput = document.getElementById('question');
            const answerDiv = document.getElementById('answer');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('askBtn');
            
            const q = questionInput.value.trim();
            if (!q) return;

            // UI state
            answerDiv.innerText = "Thinking...";
            answerDiv.style.opacity = "0.6";
            loader.style.display = "block";
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8000/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                answerDiv.innerText = data.answer;
            } catch (err) {
                answerDiv.innerText = "Error: Could not connect to the server. Make sure main.py is running.";
                console.error(err);
            } finally {
                answerDiv.style.opacity = "1";
                loader.style.display = "none";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
